<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Dashboard Pro</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        h1 {
            color: #38bdf8;
            font-size: 22px;
            margin: 0;
        }
        .status-badge {
            background-color: #eab308;
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
        }
        .online {
            background-color: #22c55e !important;
        }
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .card {
            background-color: #1e293b;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #334155;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .card h3 {
            margin-top: 0;
            color: #94a3b8;
            font-size: 14px;
        }
        .card .value {
            font-size: 28px;
            font-weight: bold;
            color: #f1f5f9;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1 id="project-title">🚀 Master Dashboard Pro</h1>
            <div id="status-badge" class="status-badge">LOADING...</div>
        </header>

        <div class="card-grid">
            <div class="card">
                <h3>CPU Usage</h3>
                <div class="value" id="cpu-usage">-</div>
            </div>
            <div class="card">
                <h3>Memory Usage</h3>
                <div class="value" id="memory-usage">-</div>
            </div>
            <div class="card">
                <h3>Active Users</h3>
                <div class="value" id="active-users">-</div>
            </div>
        </div>
    </div>

    <script>
        async function fetchDashboardData() {
            try {
                const response = await fetch('/api/data');
                const data = await response.json();

                // Pastikan data wujud sebelum paparkan
                document.getElementById('project-title').innerText = `🚀 ${data.projectName || 'Master Dashboard'} (${data.version || 'v1.0'})`;

                const badge = document.getElementById('status-badge');
                badge.innerText = (data.status || 'ONLINE').toUpperCase();
                badge.classList.add('online');

                document.getElementById('cpu-usage').innerText = data.metrics?.cpuUsage || '0%';
                document.getElementById('memory-usage').innerText = data.metrics?.memoryUsage || '0 GB';
                document.getElementById('active-users').innerText = data.metrics?.activeUsers || '0';
            } catch (error) {
                console.error('Gagal memuatkan data:', error);
                const badge = document.getElementById('status-badge');
                badge.innerText = 'ERROR';
                badge.style.backgroundColor = '#ef4444';
            }
        }

        fetchDashboardData();
    </script>
</body>
</html>
